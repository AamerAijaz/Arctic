[project]
name = "mcp-polarion"
version = "0.1.0"
description = "MCP server for Arctic Polarion tools"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2",
    "httpx>=0.27",
]

[project.scripts]
mcp-polarion = "mcp_polarion.server:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
