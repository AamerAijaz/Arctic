[package]
name = "arctic-desktop"
version = "0.1.0"
description = "Arctic desktop app"
edition = "2021"
publish = false

[lib]
name = "arctic_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = [] }
tauri-plugin-single-instance = "2.5.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
getrandom = "0.3.4"
tokio = { version = "1.53", features = ["process", "time", "io-util", "sync", "macros", "rt"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "net", "io-util"] }
