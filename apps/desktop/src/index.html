<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Arctic</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #101114;
        --sidebar: #17191e;
        --line: #2c3038;
        --text: #f3f4f6;
        --muted: #9aa0aa;
        --accent: #8ea2ff;
        --person: #2c3868;
        --card: #1c1f26;
        --danger-bg: #3a2428;
        --danger-text: #ffc7c7;
        font-family: "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
      }

      body {
        display: grid;
        grid-template-columns: 280px minmax(0, 1fr);
      }

      aside {
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-height: 0;
        overflow: hidden;
        padding: 20px 16px;
        background: var(--sidebar);
        border-right: 1px solid var(--line);
      }

      .conversations {
        display: flex;
        flex-direction: column;
        gap: 8px;
        flex: 1;
        min-height: 0;
      }

      .section-label {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
      }

      #conversation-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
        flex: 1;
        min-height: 0;
        overflow: auto;
      }

      #new-conversation,
      .conversation-row {
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--text);
        font-weight: 400;
        text-align: left;
        padding: 10px 12px;
        cursor: pointer;
      }

      #new-conversation { border: 1px solid var(--line); }

      .conversation-row.open { background: var(--person); }

      .settings {
        display: flex;
        flex-direction: column;
        gap: 16px;
        flex-shrink: 0;
      }

      .brand {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .brand strong { font-size: 18px; letter-spacing: 0.01em; }
      .brand span, .hint, label { color: var(--muted); font-size: 12px; }

      label { display: flex; flex-direction: column; gap: 6px; }

      .secret-row { display: flex; gap: 8px; align-items: center; }

      .secret-row input { flex: 1; }

      #reveal {
        flex: none;
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        padding: 0;
        background: #2a2e38;
        color: var(--text);
      }

      #reveal.revealed { color: var(--accent); }

      input, textarea, button {
        font: inherit;
        color: var(--text);
      }

      input, textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #101114;
        padding: 10px 12px;
      }

      input:focus, textarea:focus {
        outline: 2px solid var(--accent);
        border-color: transparent;
      }

      main {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        min-width: 0;
      }

      header {
        padding: 16px 24px;
        border-bottom: 1px solid var(--line);
        font-size: 14px;
      }

      #transcript {
        overflow: auto;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .empty {
        margin: auto;
        max-width: 360px;
        text-align: center;
        color: var(--muted);
      }

      .bubble {
        max-width: min(680px, 85%);
        padding: 12px 14px;
        border-radius: 14px;
        white-space: pre-wrap;
        line-height: 1.45;
      }

      .person {
        align-self: flex-end;
        background: var(--person);
      }

      .assistant {
        align-self: flex-start;
        background: var(--card);
        border: 1px solid var(--line);
      }

      .failure {
        align-self: stretch;
        background: var(--danger-bg);
        color: var(--danger-text);
      }

      #composer {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        align-items: end;
        margin: 0 24px 20px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: #16181d;
      }

      textarea {
        resize: none;
        min-height: 52px;
        max-height: 160px;
        border: 0;
        background: transparent;
        padding: 8px;
      }

      #send {
        border: 0;
        border-radius: 999px;
        padding: 10px 16px;
        background: var(--accent);
        color: #101114;
        font-weight: 650;
        cursor: pointer;
      }

      #send:disabled { opacity: 0.55; cursor: default; }

      #status {
        grid-column: 1 / -1;
        color: var(--danger-text);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <aside>
      <div class="brand">
        <strong>Arctic</strong>
        <span>Host</span>
      </div>
      <section class="conversations">
        <p class="section-label">Conversations</p>
        <button id="new-conversation" type="button">New conversation</button>
        <div id="conversation-list"></div>
      </section>
      <div class="settings">
      <label>
        API root
        <input id="api-root" value="https://api.openai.com/v1" />
      </label>
      <label>
        Model
        <input id="model-name" value="gpt-4o-mini" />
      </label>
      <label>
        LLM Credential
        <span class="secret-row">
          <input id="credential" type="password" autocomplete="off" />
          <button id="reveal" type="button" aria-label="Show LLM Credential">
            <svg id="eye" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path fill="none" stroke="currentColor" stroke-width="2" d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/>
              <circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/>
            </svg>
          </button>
        </span>
      </label>
      <p class="hint">The credential is not written into the conversation.</p>
      </div>
    </aside>
    <main>
      <header id="title">Conversation</header>
      <section id="transcript" aria-live="polite"></section>
      <form id="composer">
        <textarea id="message" rows="2" placeholder="Send a message"></textarea>
        <button id="send" type="submit">Send</button>
        <p id="status" hidden></p>
      </form>
    </main>
    <script>
      const apiRoot = document.querySelector("#api-root");
      const modelName = document.querySelector("#model-name");
      const credential = document.querySelector("#credential");
      const reveal = document.querySelector("#reveal");
      const message = document.querySelector("#message");
      const transcript = document.querySelector("#transcript");
      const conversationList = document.querySelector("#conversation-list");
      const title = document.querySelector("#title");
      const send = document.querySelector("#send");
      const composer = document.querySelector("#composer");
      const status = document.querySelector("#status");

      function showStatus(text) {
        status.hidden = text === "";
        status.textContent = text;
      }

      let viewGeneration = 0;

      function showView(view) {
        const open = view.conversations.find((conversation) => conversation.open);
        title.textContent = open ? open.title : "Conversation";
        conversationList.replaceChildren();
        if (view.conversations.length === 0) {
          const none = document.createElement("p");
          none.className = "hint";
          none.textContent = "No conversations yet";
          conversationList.append(none);
        } else {
          for (const conversation of view.conversations) {
            const row = document.createElement("button");
            row.type = "button";
            row.className = "conversation-row" + (conversation.open ? " open" : "");
            row.textContent = conversation.title;
            row.addEventListener("click", () => {
              void takeView(() => window.host.open(conversation.id));
            });
            conversationList.append(row);
          }
        }
        transcript.replaceChildren();
        if (view.transcript.length === 0) {
          const empty = document.createElement("p");
          empty.className = "empty";
          empty.textContent = "Send a message to start this conversation.";
          transcript.append(empty);
          return;
        }
        for (const entry of view.transcript) {
          const line = document.createElement("p");
          line.className = "bubble " + entry.role;
          const speaker = entry.role === "person" ? "You" : entry.role === "assistant" ? "Model" : "Failed";
          line.textContent = speaker + ": " + entry.text;
          transcript.append(line);
        }
        transcript.scrollTop = transcript.scrollHeight;
      }

      function takeView(request) {
        const generation = ++viewGeneration;
        return request().then((view) => {
          if (generation === viewGeneration) {
            showView(view);
          }
          return view;
        });
      }

      async function onSend() {
        showStatus("");
        if (!window.host) {
          showStatus("The Host bridge is not available.");
          return;
        }
        const text = message.value;
        const generation = ++viewGeneration;
        send.disabled = true;
        try {
          const saved = await window.host.saveConfig({
            apiRoot: apiRoot.value,
            model: modelName.value,
            apiKey: credential.value,
          });
          if (saved.apiRoot) {
            apiRoot.value = saved.apiRoot;
          }
          if (saved.model) {
            modelName.value = saved.model;
          }
          credential.value = saved.apiKey;
          const view = await window.host.send(text);
          if (generation === viewGeneration) {
            showView(view);
          }
          if (text.trim() !== "") {
            message.value = "";
          }
        } catch (error) {
          showStatus(error instanceof Error ? error.message : "The message could not be sent.");
        } finally {
          send.disabled = false;
          message.focus();
        }
      }

      composer.addEventListener("submit", (event) => {
        event.preventDefault();
        void onSend();
      });

      message.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          void onSend();
        }
      });

      reveal.addEventListener("click", () => {
        const hidden = credential.type === "password";
        credential.type = hidden ? "text" : "password";
        reveal.classList.toggle("revealed", hidden);
        reveal.setAttribute("aria-label", hidden ? "Hide LLM Credential" : "Show LLM Credential");
      });

      document.querySelector("#new-conversation").addEventListener("click", () => {
        if (!window.host) {
          showStatus("The Host bridge is not available.");
          return;
        }
        void takeView(() => window.host.start());
      });

      if (window.host) {
        void takeView(() => window.host.load());
        void window.host.loadConfig().then((saved) => {
          if (saved.apiRoot) {
            apiRoot.value = saved.apiRoot;
          }
          if (saved.model) {
            modelName.value = saved.model;
          }
          if (saved.apiKey) {
            credential.value = saved.apiKey;
          }
        });
      } else {
        showView({ conversations: [], transcript: [] });
      }
    </script>
  </body>
</html>
